services:
  db:
    image: postgres:16-alpine
    container_name: hustle-db
    environment:
      POSTGRES_USER: hustle
      POSTGRES_PASSWORD: hustle
      POSTGRES_DB: hustle
    ports:
      - "5432:5432"
    volumes:
      - hustle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hustle -d hustle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hustle_pgdata:
